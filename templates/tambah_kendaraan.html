
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Kendaraan - TruckScan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f3f5f7;
            font-family: Arial, sans-serif;
        }

        .container-main {
            width: 96%;
            max-width: 1200px;
            margin: 25px auto;
        }

        .card-main {
            background: white;
            padding: 22px;
            border-radius: 15px;
            box-shadow: 0 4px 18px rgba(0,0,0,.07);
        }

        .camera-box {
            background: #101820;
            border-radius: 12px;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: min(65vh, 650px);
            min-height: 350px;
            object-fit: contain;
            background: #101820;
        }

        canvas {
            display: none;
        }
    </style>
</head>

<body>

<div class="container-main">
    <div class="card-main">

        <h3 class="fw-bold">Tambah Kendaraan Baru</h3>
        <p class="text-secondary">
            Sistem mencoba membaca plat nomor melalui kamera.
            Jika tidak terbaca, masukkan nomor plat secara manual.
        </p>

        <div class="camera-box mb-3">
            <video id="video" autoplay muted playsinline></video>
        </div>

        <canvas id="canvas"></canvas>

        <div id="status" class="alert alert-info">
            Mengaktifkan kamera...
        </div>

        <button type="button" id="stopCamera" class="btn btn-danger mb-3">
            Matikan Kamera
        </button>

        <button type="button" id="startCamera" class="btn btn-primary mb-3" style="display:none">
            Nyalakan Kamera
        </button>

        <hr>

        <h5 class="fw-bold">Masukkan Nomor Plat</h5>

        <form method="POST" action="{{ url_for('tambah_kendaraan') }}">

            <label class="form-label">Plat Nomor Kendaraan</label>

            <input
                type="text"
                name="plat_nomor"
                id="platNomor"
                class="form-control form-control-lg text-uppercase"
                placeholder="Contoh: AG 1234 GV"
                value="{{ plat }}"
                maxlength="15"
                autocomplete="off"
                required
            >

            <button type="submit" class="btn btn-success w-100 mt-3">
                Simpan dan Catat Kendaraan Masuk
            </button>

        </form>

        <a href="{{ url_for('scan') }}" class="btn btn-outline-secondary w-100 mt-2">
            Kembali ke Scan
        </a>

    </div>
</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const inputPlat = document.getElementById("platNomor");
const statusBox = document.getElementById("status");

const stopButton = document.getElementById("stopCamera");
const startButton = document.getElementById("startCamera");

let cameraStream = null;
let scanAktif = false;
let sedangMemproses = false;
let scanTimer = null;

function tampilkanStatus(pesan, jenis = "info") {
    statusBox.className = "alert alert-" + jenis;
    statusBox.textContent = pesan;
}

async function mulaiKamera() {
    try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
            video: {
                width: { ideal: 1920 },
                height: { ideal: 1080 },
                facingMode: "environment"
            },
            audio: false
        });

        video.srcObject = cameraStream;
        await video.play();

        scanAktif = true;
        stopButton.disabled = false;
        startButton.style.display = "none";

        tampilkanStatus("Kamera aktif. Sedang mencari plat nomor...", "success");

        jadwalkanScan();

    } catch (error) {
        tampilkanStatus("Kamera gagal dibuka: " + error.message, "danger");
        startButton.style.display = "inline-block";
    }
}

function jadwalkanScan() {
    if (!scanAktif) return;

    clearTimeout(scanTimer);

    scanTimer = setTimeout(async () => {
        await prosesFrame();

        if (scanAktif) {
            jadwalkanScan();
        }
    }, 1200);
}

async function prosesFrame() {
    if (sedangMemproses || !cameraStream || !video.videoWidth) {
        return;
    }

    sedangMemproses = true;

    try {
        const skala = Math.min(1, 1280 / video.videoWidth);

        canvas.width = Math.round(video.videoWidth * skala);
        canvas.height = Math.round(video.videoHeight * skala);

        const context = canvas.getContext("2d");
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        const blob = await new Promise(resolve => {
            canvas.toBlob(resolve, "image/jpeg", 0.90);
        });

        if (!blob) {
            throw new Error("Gagal mengambil gambar.");
        }

        const data = new FormData();
        data.append("image", blob, "scan.jpg");

        const response = await fetch("/proses-scan", {
            method: "POST",
            body: data
        });

        const hasil = await response.json();

        if (!response.ok) {
            throw new Error(hasil.error || "Gagal membaca gambar.");
        }

        if (hasil.terdeteksi && hasil.plat_nomor) {
            inputPlat.value = hasil.plat_nomor;

            scanAktif = false;
            clearTimeout(scanTimer);

            tampilkanStatus(
                "Plat terdeteksi: " + hasil.plat_nomor +
                ". Periksa nomor plat lalu simpan.",
                "success"
            );
        } else {
            tampilkanStatus(
                "Plat nomor tidak ditemukan. Coba dekatkan kamera atau masukkan plat secara manual.",
                "warning"
            );
        }

    } catch (error) {
        tampilkanStatus("Kesalahan scan: " + error.message, "danger");
    } finally {
        sedangMemproses = false;
    }
}

function matikanKamera() {
    scanAktif = false;
    clearTimeout(scanTimer);

    if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
    }

    video.srcObject = null;

    stopButton.disabled = true;
    startButton.style.display = "inline-block";

    tampilkanStatus("Kamera sudah dimatikan.");
}

stopButton.addEventListener("click", matikanKamera);
startButton.addEventListener("click", mulaiKamera);

document.addEventListener("DOMContentLoaded", mulaiKamera);
</script>

</body>
</html>
